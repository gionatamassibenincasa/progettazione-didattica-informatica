  - numero: "ITP-1"
    descrizione: "Toolchain, Documentazione Tecnica e Controllo di Versione"
    periodo: "14 Settembre 2026 -- 24 Ottobre 2026 (Settimane 1-6, 12 Ore)"

    competenze_disciplinari:
      - testo: "Configurare l'ambiente di sviluppo ed eseguire in autonomia la gestione del controllo di versione per progetti software."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.4"

    abilita:
      - testo: "Configurare e gestire in autonomia l'ambiente di sviluppo (IDE, compilatore, estensioni)."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "5.2"
      - testo: "Documentare codice ed esperienze di laboratorio in formato Markdown."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.1"
      - testo: "Tracciare e pubblicare le versioni dei propri progetti su repository GitHub."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.2"
      - testo: "Utilizzare il debugger dell'IDE per isolare ed eliminare errori logici."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.4"

    conoscenze:
      - testo: "Strutturazione di documenti in Markdown (sintassi base, tabelle, blocchi di codice) ed uso di VS Code e Jupyter Lite."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
