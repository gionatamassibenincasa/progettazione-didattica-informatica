# yaml-language-server: $schema=../schemas/schema_programmazione.json
#
# Riorganizzata per aderire più da vicino alla tabella "Secondo Biennio"
# di Informatica_AFM_Secondo_Biennio.md (Linee Guida ministeriali
# ufficiali), dopo una validazione a posteriori sulle versioni precedenti
# (basate su
# /Users/paolo.mosca/Downloads/Scuola/Programmazione/AFM/programmazione_didattica_quarta_ite_afm.md).
#
# RIMOSSO (su richiesta esplicita, perché non richiesto dalla tabella
# indirizzo del secondo biennio):
#   - "Codifica avanzata e gestione della sicurezza documentale aziendale"
#     (fatturazione elettronica XML/SDI, conservazione sostitutiva): molto
#     rilevante professionalmente, ma non è una voce della tabella
#     ministeriale del secondo biennio per l'AFM.
#   - "Foglio di calcolo avanzato, modelli finanziari e automazione
#     d'ufficio" (funzioni finanziarie, macro/VBA): non citato nella
#     tabella del secondo biennio (il foglio elettronico è materia di
#     primo biennio). La parte sul controllo di gestione, che nella
#     vecchia UFC1 era solo nel titolo del modulo SQL, è stata invece
#     sviluppata in una UFC dedicata (vedi sotto), perché è una vera
#     competenza d'indirizzo ministeriale.
#   - Dalla vecchia UFC "Reti aziendali, sicurezza, e-commerce e digital
#     marketing" sono stati rimossi i contenuti più tecnici non richiesti
#     (cloud SaaS/PaaS/IaaS, sicurezza/GDPR/backup di dettaglio, metriche
#     SEO/SEM) mantenendo e valorizzando solo le parti realmente citate
#     dalla tabella ministeriale: servizi di rete per attività commerciali
#     (e-commerce) e il tema del marketing (separati in due UFC, vedi
#     sotto, per aderire meglio alle due competenze ministeriali distinte).
#
# AGGIUNTO (voci ministeriali rimaste scoperte, distribuite qui per
# bilanciare il numero di UFC tra 3a e 4a — 5 in 3a, 6 in 4a):
#   - UFC2 "Controllo di gestione: budget e analisi degli scostamenti",
#     per la competenza "applicare i principi e gli strumenti della
#     programmazione e del controllo di gestione, analizzandone i
#     risultati".
#   - UFC5 "Marketing e sistemi informativi per la comunicazione
#     d'impresa", per la competenza "inquadrare l'attività di marketing
#     nel ciclo di vita dell'azienda... diverse politiche di mercato".
#   - UFC6 "Servizi di rete per l'azienda, innovazione tecnologica e
#     scelta di soluzioni gestionali", per le voci "servizi di rete a
#     supporto dell'azienda... attività commerciali", "software di
#     utilità e software gestionali: manutenzione e adattamenti",
#     "scegliere e personalizzare software applicativi in relazione al
#     fabbisogno aziendale" e "individuare gli aspetti tecnologici
#     innovativi per il miglioramento dell'organizzazione aziendale".
#
# MANTENUTO, in parte accorpato: la vecchia UFC2 (modellazione E-R) e UFC3
# (SQL) sono state fuse nella UFC3 "Progettazione avanzata di basi di dati
# e SQL", per fare spazio alle nuove UFC senza eccedere nel numero totale;
# UFC1 (contabilità integrata) e UFC4 (ipermedia/Web, qui UFC4) restano
# sostanzialmente invariate.
#
# Gli obiettivi minimi (is_minimo: true) sono scelti dall'assistente (il
# documento sorgente della riscrittura precedente non è più seguito 1:1).
# Riferimenti DigComp 3.0 e CINI (O-S-*, i codici del biennio riusati solo
# dove il contenuto corrisponde davvero — O-S-D-1 per normalizzazione E-R,
# O-S-D-3 per HTML/markup, O-S-R-2 per servizi di rete/e-commerce;
# contabilità integrata, controllo di gestione e marketing non hanno
# equivalente nella proposta CINI 2017) verificati contro i documenti in
# docs/riferimenti/, incluso Informatica_AFM_Secondo_Biennio.md.

frameworks:
  DIGCOMP_3.0:
    nome: "Digital Competence Framework for Citizens (DigComp 3.0/2.2)"
    url: "https://joint-research-centre.ec.europa.eu/digcomp_en"
  CINI_INF:
    nome: "Indicazioni Nazionali per l'Insegnamento dell'Informatica - Consorzio CINI"
    url: "https://www.consorzio-cini.it/images/Proposta-Indicazioni-Nazionali-Informatica-Scuola-numerata.pdf"

dipartimento: "INFORMATICA"
ordinamento: "TECNICO ECONOMICO"
indirizzo: "AFM"
classe: "QUARTA"

ufcs:
  - numero: 1
    descrizione: "Software di contabilità integrata e gestione delle rilevazioni aziendali"
    periodo: "Settembre-Ottobre"

    competenze_disciplinari:
      - testo: "Gestire il sistema delle rilevazioni aziendali con l'ausilio di programmi di contabilità integrata."
        is_minimo: true

    abilita:
      - testo: "Registrare le principali rilevazioni contabili (fatture attive/passive, prima nota, incassi e pagamenti) in un software di contabilità integrata."
        is_minimo: true
      - testo: "Gestire l'anagrafica di clienti, fornitori e articoli di magazzino in un software gestionale."
        is_minimo: true
      - testo: "Estrarre report e situazioni contabili di sintesi (partitari, scadenzario, saldi) da un software gestionale."
        is_minimo: false
      - testo: "Riconoscere i vantaggi dell'integrazione tra moduli contabili, di magazzino e di fatturazione in un sistema informativo aziendale unico."
        is_minimo: false

    conoscenze:
      - testo: "Funzioni di un software di contabilità integrata: prima nota, partita doppia informatizzata, fatturazione, magazzino."
        is_minimo: true
      - testo: "Integrazione tra i moduli di un sistema informativo aziendale (contabilità, magazzino, fatturazione, clienti/fornitori)."
        is_minimo: false

    competenze_civica:
      - testo: "Riconoscere l'importanza dei sistemi informativi aziendali e il ruolo dell'ICT nella loro automatizzazione."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "5.2"

    verifiche:
      - tipo: "Pratico"
        numero: 1
        strumenti: "Esercitazioni con software di contabilità integrata (registrazione fatture, prima nota, report)"

  - numero: 2
    descrizione: "Controllo di gestione: budget e analisi degli scostamenti"
    periodo: "Novembre-Dicembre"

    competenze_disciplinari:
      - testo: "Applicare i principi e gli strumenti della programmazione e del controllo di gestione, analizzandone i risultati."
        is_minimo: true

    abilita:
      - testo: "Predisporre un budget aziendale a partire da dati previsionali di costi e ricavi."
        is_minimo: true
      - testo: "Calcolare gli scostamenti tra dati di budget e dati consuntivi, individuandone le cause."
        is_minimo: true
      - testo: "Utilizzare il foglio di calcolo per costruire un semplice budget e analizzarne gli scostamenti."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "1.3"
      - testo: "Interpretare i risultati del controllo di gestione per supportare le decisioni aziendali."
        is_minimo: false

    conoscenze:
      - testo: "Il budget aziendale: finalità, tipologie e struttura."
        is_minimo: true
      - testo: "L'analisi degli scostamenti tra dati programmati e dati consuntivi."
        is_minimo: true
      - testo: "Strumenti informatici a supporto del controllo di gestione."
        is_minimo: false

    competenze_civica:
      - testo: "Riconoscere l'importanza dei sistemi informativi aziendali e il ruolo dell'ICT nella loro automatizzazione."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "5.2"

    verifiche:
      - tipo: "Scritto"
        numero: 1
        strumenti: "Esercizi di costruzione budget e analisi degli scostamenti"
      - tipo: "Pratico"
        numero: 1
        strumenti: "Foglio di calcolo in laboratorio"

  - numero: 3
    descrizione: "Progettazione avanzata di basi di dati e SQL"
    periodo: "Gennaio-Febbraio"

    competenze_disciplinari:
      - testo: "Analizzare casi di studio aziendali per estrarre requisiti informativi, progettando lo schema E-R e trasformandolo nello schema relazionale ottimizzato per un DBMS d'impresa."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-1"
      - testo: "Creare e popolare la struttura di un database aziendale, scrivendo query SQL complesse per elaborare report di vendita e analizzare le giacenze di magazzino."
        is_minimo: false

    abilita:
      - testo: "Distinguere i concetti di Entità, Attributo, Campo e Tabella."
        is_minimo: true
      - testo: "Collegare due tabelle mediante chiave esterna rispettando una relazione 1:N (es. Cliente-Ordini)."
        is_minimo: true
      - testo: "Applicare le regole di normalizzazione (1NF, 2NF, 3NF) per eliminare ridondanze e anomalie."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-1"
      - testo: "Scrivere ed eseguire query di selezione con SELECT ... FROM ... WHERE e applicare funzioni di aggregazione (SUM, COUNT)."
        is_minimo: true
      - testo: "Inserire o modificare record all'interno di una tabella tramite INSERT o UPDATE."
        is_minimo: true
      - testo: "Formulare interrogazioni con GROUP BY, HAVING e INNER JOIN per il reporting aziendale."
        is_minimo: false

    conoscenze:
      - testo: "Modello Entità-Relazione applicato a processi di business (ordini, clienti, fornitori, magazzino, fatturazione); normalizzazione (1NF, 2NF, 3NF)."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-1"
      - testo: "Linguaggio DML: INSERT, UPDATE, DELETE."
        is_minimo: true
      - testo: "Linguaggio DQL: SELECT, WHERE, ORDER BY; funzioni aggregate, GROUP BY, HAVING, INNER JOIN."
        is_minimo: true

    competenze_civica:
      - testo: "Gestire dati e informazioni mediante strumenti di interrogazione strutturata."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "1.3"

    verifiche:
      - tipo: "Scritto"
        numero: 1
        strumenti: "Esercizi di modellazione E-R e normalizzazione"
      - tipo: "Pratico"
        numero: 1
        strumenti: "Scrittura di query SQL in laboratorio"

  - numero: 4
    descrizione: "Ipermedia e progettazione di pagine Web"
    periodo: "Marzo"

    competenze_disciplinari:
      - testo: "Utilizzare i sistemi informativi aziendali e gli strumenti di comunicazione integrata d'impresa, per realizzare attività comunicative con riferimento a differenti contesti."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-3"

    abilita:
      - testo: "Realizzare pagine Web statiche curando struttura, usabilità e accessibilità."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-3"
      - testo: "Produrre ipermedia integrando e contestualizzando oggetti (testo, immagini, audio, video) selezionati da più fonti."
        is_minimo: true
      - testo: "Strutturare i contenuti di un sito Web in coerenza con gli obiettivi comunicativi dell'impresa."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.1"
      - testo: "Pubblicare pagine Web nel rispetto delle norme su copyright e riutilizzo dei contenuti."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.3"

    conoscenze:
      - testo: "Linguaggi del Web: sintassi di base di HTML e cenni di CSS."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-3"
      - testo: "Struttura, usabilità e accessibilità di un sito Web."
        is_minimo: true
      - testo: "Fasi di sviluppo di un ipermedia."
        is_minimo: false

    competenze_civica:
      - testo: "Sviluppare contenuti digitali per il Web in formati appropriati al contesto d'uso."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.1"

    verifiche:
      - tipo: "Pratico"
        numero: 1
        strumenti: "Realizzazione di pagine Web e ipermedia in laboratorio"

  - numero: 5
    descrizione: "Marketing e sistemi informativi per la comunicazione d'impresa"
    periodo: "Aprile"

    competenze_disciplinari:
      - testo: "Inquadrare l'attività di marketing nel ciclo di vita dell'azienda e realizzare applicazioni con riferimento a specifici contesti e diverse politiche di mercato."
        is_minimo: true

    abilita:
      - testo: "Utilizzare strumenti informatici (database clienti, siti Web, social media) a supporto delle attività di marketing."
        is_minimo: true
      - testo: "Analizzare dati di vendita e di mercato per supportare decisioni di marketing."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "1.3"
      - testo: "Distinguere le politiche di mercato in relazione alle diverse fasi del ciclo di vita di un prodotto o dell'azienda."
        is_minimo: false

    conoscenze:
      - testo: "Il ciclo di vita dell'azienda e del prodotto; politiche di mercato."
        is_minimo: true
      - testo: "Strumenti informatici a supporto del marketing: gestione dati clienti, presenza sul Web e sui social media."
        is_minimo: true

    competenze_civica:
      - testo: "Sviluppare contenuti digitali per la comunicazione e il marketing d'impresa."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.1"

    verifiche:
      - tipo: "Orale"
        numero: 1
        strumenti: "Discussione guidata"
      - tipo: "Scritto"
        numero: 1
        strumenti: "Analisi di casi aziendali di marketing"

  - numero: 6
    descrizione: "Servizi di rete per l'azienda, innovazione tecnologica e scelta di soluzioni gestionali"
    periodo: "Maggio-Giugno"

    competenze_disciplinari:
      - testo: "Individuare gli aspetti tecnologici innovativi per il miglioramento dell'organizzazione aziendale, scegliendo e personalizzando software applicativi in relazione al fabbisogno."
        is_minimo: true

    abilita:
      - testo: "Riconoscere i servizi di rete a supporto dell'azienda, con particolare riferimento alle attività commerciali (e-commerce B2B e B2C)."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-R-2"
      - testo: "Scegliere e personalizzare software applicativi in relazione al fabbisogno aziendale."
        is_minimo: true
      - testo: "Individuare gli aspetti tecnologici innovativi per il miglioramento dell'organizzazione aziendale."
        is_minimo: true
      - testo: "Valutare le esigenze di manutenzione e adattamento di un software gestionale nel tempo."
        is_minimo: false

    conoscenze:
      - testo: "Servizi di rete a supporto dell'azienda: e-commerce B2B e B2C, servizi cloud."
        is_minimo: true
      - testo: "Software di utilità e software gestionali: criteri di scelta, manutenzione e adattamenti."
        is_minimo: true
      - testo: "Tecnologie innovative per l'organizzazione aziendale (cenni)."
        is_minimo: false

    competenze_civica:
      - testo: "Identificare bisogni e risposte tecnologiche adeguate al contesto aziendale."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "5.2"

    verifiche:
      - tipo: "Orale"
        numero: 1
        strumenti: "Analisi di casi aziendali\nDiscussione guidata su scelta di soluzioni software"
