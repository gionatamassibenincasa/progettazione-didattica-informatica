# yaml-language-server: $schema=../schemas/schema_programmazione.json
#
# Aggiornata sulla base di
# /Users/paolo.mosca/Downloads/Scuola/Programmazione/AFM/programmazione_didattica_terza_afm_info_pp_2.md
# (6 moduli: Struttura del computer/reti/SO in ambito aziendale, Foglio di
# calcolo avanzato, Modellazione E-R, Modello relazionale e tabelle,
# Interrogazione dati/SQL base, Automatizzazione/reportistica/integrazione
# dati). Il documento sorgente stimava ~90 ore totali (12+24+14+14+18+8),
# incompatibili con il quadro orario di Informatica in AFM (2 ore
# settimanali in 3a/4a, ~66 ore annue — stessa correzione già applicata alle
# programmazioni del Liceo Scientifico SA).
#
# Aggiunta una UFC "Gestione dei progetti: metodologie e tecniche" (non
# presente nel documento sorgente) per coprire la competenza d'indirizzo
# ministeriale "identificare e applicare le metodologie e le tecniche della
# gestione per progetti" (Informatica_AFM_Secondo_Biennio.md), su richiesta
# esplicita dell'utente dopo la segnalazione di questa lacuna. Le ore dei
# moduli sono state riproporzionate per lasciarle spazio, per un totale di
# ~66 ore.
#
# Gli obiettivi minimi (is_minimo: true) delle UFC 1, 2, 4-7 riprendono il
# "Quadro sintetico degli obiettivi minimi" del documento sorgente (6 punti,
# mappati 1:1): 1. Sistemi e sicurezza; 2. Foglio di calcolo; 3. (nel
# documento sorgente) Progettazione database → qui UFC4; 4. Struttura
# tabelle → UFC5; 5. Query e SQL → UFC6; 6. Report e maschere → UFC7. Gli
# obiettivi minimi della UFC3 (Gestione progetti) sono scelti dall'assistente.
#
# Riferimenti DigComp 3.0 e CINI (O-S-*, i codici del biennio riusati solo
# dove il contenuto corrisponde davvero — foglio di calcolo, SQL, hardware e
# project management non hanno equivalente nella proposta CINI 2017,
# lasciati senza codice) verificati contro i documenti in docs/riferimenti/,
# incluso Informatica_AFM_Secondo_Biennio.md (Linee Guida ministeriali
# ufficiali per Informatica in AFM, secondo biennio).
#
# NOTA: le Linee Guida ministeriali elencano anche "gestire il sistema delle
# rilevazioni aziendali con l'ausilio di programmi di contabilità
# integrata" tra le competenze d'indirizzo — per decisione dell'utente
# questo argomento sarà aggiunto alla programmazione della 4a AFM, non qui.

frameworks:
  DIGCOMP_3.0:
    nome: "Digital Competence Framework for Citizens (DigComp 3.0/2.2)"
    url: "https://joint-research-centre.ec.europa.eu/digcomp_en"
  CINI_INF:
    nome: "Indicazioni Nazionali per l'Insegnamento dell'Informatica - Consorzio CINI"
    url: "https://www.consorzio-cini.it/images/Proposta-Indicazioni-Nazionali-Informatica-Scuola-numerata.pdf"

dipartimento: "INFORMATICA"
ordinamento: "TECNICO ECONOMICO"
indirizzo: "AFM"
classe: "TERZA"

ufcs:
  - numero: 1
    descrizione: "Struttura del computer, reti e sistemi operativi in ambito aziendale"
    periodo: "Settembre-Ottobre"

    competenze_disciplinari:
      - testo: "Organizzare il file system per la gestione ordinata di documenti amministrativi e contabili."
        is_minimo: true
      - testo: "Utilizzare in sicurezza gli strumenti di rete e i servizi cloud per la condivisione di documenti aziendali."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-N-4"

    abilita:
      - testo: "Distinguere le componenti hardware principali di un computer (RAM, CPU, hard disk/SSD)."
        is_minimo: true
      - testo: "Gestire file e cartelle (creazione, rinomina, spostamento, compressione)."
        is_minimo: true
      - testo: "Applicare le norme essenziali di sicurezza informatica (password sicure, riconoscimento di email sospette)."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-N-4"
      - testo: "Condividere risorse di rete (stampanti, dischi di rete) e utilizzare servizi di cloud storage."
        is_minimo: false

    conoscenze:
      - testo: "Architettura dell'elaboratore: CPU, memoria RAM, memorie di massa."
        is_minimo: true
      - testo: "Sistemi operativi: gestione dei file, organizzazione delle cartelle aziendali, permessi di accesso."
        is_minimo: true
      - testo: "Rete locale (LAN), condivisione di risorse e cloud storage."
        is_minimo: false
      - testo: "Sicurezza informatica di base: backup, minacce informatiche (phishing, malware), normativa sulla privacy (GDPR)."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-N-4"

    competenze_civica:
      - testo: "Proteggere i dispositivi digitali comprendendo rischi e minacce (backup, malware, phishing)."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "4.1"
      - testo: "Rispettare la normativa sulla privacy e la protezione dei dati personali (GDPR)."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "4.2"

    verifiche_num: "1 scritta"
    verifiche_strumenti: "Test a scelta multipla\nDomande a risposta aperta"

  - numero: 2
    descrizione: "Foglio di calcolo avanzato per l'economia e la gestione aziendale"
    periodo: "Novembre-Dicembre"

    competenze_disciplinari:
      - testo: "Costruire modelli di calcolo per il bilancio aziendale, la fatturazione, il calcolo degli ammortamenti e delle rate di mutui."
        is_minimo: false
      - testo: "Sintetizzare ed estrarre informazioni da grandi moli di dati aziendali tramite le tabelle pivot."
        is_minimo: false

    abilita:
      - testo: "Utilizzare i riferimenti relativi e assoluti ($) nelle formule."
        is_minimo: true
      - testo: "Utilizzare le funzioni base (SOMMA, MEDIA, SE semplice)."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "1.3"
      - testo: "Creare un grafico a barre o a torta a partire da una tabella di dati."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.1"
      - testo: "Utilizzare funzioni statistiche e finanziarie (CONTA.SE, SOMMA.SE, RATA, INTERESSI)."
        is_minimo: false
      - testo: "Utilizzare funzioni logiche e di ricerca (SE, E, O, SE.ERRORE, CERCA.VERT/CERCA.X)."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.4"
      - testo: "Realizzare tabelle pivot, filtri avanzati e formattazione condizionale per l'analisi di dati aziendali."
        is_minimo: false

    conoscenze:
      - testo: "Riferimenti relativi, assoluti e misti nelle formule."
        is_minimo: true
      - testo: "Funzioni matematiche, statistiche, finanziarie, logiche e di ricerca."
        is_minimo: false
      - testo: "Tabelle pivot, filtri avanzati, formattazione condizionale, analisi di scenario e grafici avanzati."
        is_minimo: false

    competenze_civica:
      - testo: "Gestire dati e informazioni aziendali in modo strutturato mediante strumenti di calcolo."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "1.3"

    verifiche_num: "1 pratica"
    verifiche_strumenti: "Sviluppo di modelli su foglio di calcolo in laboratorio"

  - numero: 3
    descrizione: "Gestione dei progetti: metodologie e tecniche"
    periodo: "Gennaio"

    competenze_disciplinari:
      - testo: "Identificare e applicare le metodologie e le tecniche della gestione per progetti."
        is_minimo: true

    abilita:
      - testo: "Individuare le fasi del ciclo di vita di un progetto (avvio, pianificazione, esecuzione, controllo, chiusura)."
        is_minimo: true
      - testo: "Scomporre un progetto in attività elementari mediante una Work Breakdown Structure (WBS)."
        is_minimo: true
      - testo: "Costruire un diagramma di Gantt per pianificare tempi e risorse di un progetto, anche con l'ausilio del foglio di calcolo."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "1.3"
      - testo: "Individuare i principali rischi di un progetto e le azioni di mitigazione."
        is_minimo: false

    conoscenze:
      - testo: "Il ciclo di vita di un progetto: fasi e obiettivi."
        is_minimo: true
      - testo: "Work Breakdown Structure (WBS) e diagramma di Gantt."
        is_minimo: true
      - testo: "Ruoli e responsabilità in un progetto (project manager, team, stakeholder); elementi di gestione del rischio."
        is_minimo: false

    competenze_civica:
      - testo: "Identificare bisogni e risposte tecnologiche adeguate alla pianificazione di un progetto."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "5.2"

    verifiche_num: "1 pratica"
    verifiche_strumenti: "Costruzione di un diagramma di Gantt in laboratorio\nEsercizi di scomposizione WBS"

  - numero: 4
    descrizione: "Modellazione concettuale e progettazione di basi di dati (modello E-R)"
    periodo: "Febbraio"

    competenze_disciplinari:
      - testo: "Analizzare i requisiti informativi di una realtà aziendale e rappresentarli mediante uno schema Entità-Relazione coerente."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-1"

    abilita:
      - testo: "Riconoscere i concetti di Entità, Attributo e Chiave Primaria."
        is_minimo: true
      - testo: "Distinguere una relazione 1 a N da una relazione N a M in un semplice contesto aziendale."
        is_minimo: true
      - testo: "Analizzare casi di studio economico-aziendali (gestione clienti/ordini, magazzino, fatturazione) per individuarne entità e relazioni."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-1"

    conoscenze:
      - testo: "Dai dati informali alla base di dati aziendale: concetti di dato, informazione e DBMS."
        is_minimo: true
      - testo: "Il modello Entità-Relazione: entità, attributi, chiave primaria."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-1"
      - testo: "Tipi di relazione (1:1, 1:N, N:M) e cardinalità."
        is_minimo: true

    competenze_civica:
      - testo: "Interpretare i sistemi aziendali nei loro modelli, processi e flussi informativi."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "1.3"

    verifiche_num: "1 scritta"
    verifiche_strumenti: "Esercizi di modellazione E-R su casi aziendali"

  - numero: 5
    descrizione: "Modello relazionale e struttura delle tabelle"
    periodo: "Marzo"

    competenze_disciplinari:
      - testo: "Tradurre uno schema Entità-Relazione in un insieme di tabelle correlate nel modello relazionale."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-1"

    abilita:
      - testo: "Identificare la chiave primaria e la chiave esterna nelle tabelle di un database elementare."
        is_minimo: true
      - testo: "Inserire, modificare e cancellare record all'interno delle tabelle di un DBMS."
        is_minimo: true
      - testo: "Creare la struttura di un database aziendale impostando i tipi di dato corretti per ogni campo e definendo le relazioni tra tabelle."
        is_minimo: false

    conoscenze:
      - testo: "Dallo schema E-R al modello relazionale: regole di derivazione."
        is_minimo: false
      - testo: "Concetto di tabella, campo, record e dominio."
        is_minimo: true
      - testo: "Chiavi primarie e chiavi esterne; integrità referenziale e regole per evitare ridondanze e anomalie."
        is_minimo: true

    competenze_civica:
      - testo: "Gestire dati, informazioni e contenuti digitali organizzandoli in strutture coerenti."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "1.3"

    verifiche_num: "1 pratica"
    verifiche_strumenti: "Creazione e popolamento di database in laboratorio (Access/LibreOffice Base)"

  - numero: 6
    descrizione: "Interrogazione dei dati: query visuali e linguaggio SQL base"
    periodo: "Aprile-Maggio"

    competenze_disciplinari:
      - testo: "Interrogare un database per estrarre informazioni utili alle decisioni aziendali."
        is_minimo: false

    abilita:
      - testo: "Creare una semplice query visuale (QBE) su una singola tabella impostando criteri di filtraggio."
        is_minimo: true
      - testo: "Scrivere una semplice istruzione SQL con la struttura SELECT ... FROM ... WHERE."
        is_minimo: true
      - testo: "Ordinare i dati con ORDER BY e applicare operatori logici (AND, OR, NOT) nei filtri."
        is_minimo: false
      - testo: "Formulare interrogazioni con join tra più tabelle e calcoli aggregati (SUM, COUNT, AVG, GROUP BY)."
        is_minimo: false

    conoscenze:
      - testo: "Creazione di interrogazioni con strumenti visuali (QBE)."
        is_minimo: true
      - testo: "Struttura dell'istruzione SELECT; clausola WHERE e operatori logici; ORDER BY."
        is_minimo: true
      - testo: "Congiunzione di più tabelle (join) e calcoli aggregati."
        is_minimo: false

    competenze_civica:
      - testo: "Gestire dati e informazioni mediante strumenti di interrogazione strutturata."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "1.3"

    verifiche_num: "1 pratica\n1 scritta"
    verifiche_strumenti: "Scrittura di query visuali e SQL in laboratorio\nQuesiti a risposta aperta"

  - numero: 7
    descrizione: "Automatizzazione, reportistica e integrazione dati aziendali"
    periodo: "Giugno"

    competenze_disciplinari:
      - testo: "Realizzare interfacce utente basilari (maschere) e report stampabili pronti per la direzione aziendale."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-N-2"

    abilita:
      - testo: "Creare una maschera semplice per l'inserimento dati tramite la procedura guidata del DBMS."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-N-2"
      - testo: "Generare un report di stampa standard a partire da una tabella o da una query."
        is_minimo: true
      - testo: "Scambiare dati tra fogli elettronici e basi di dati per l'elaborazione di report gestionali."
        is_minimo: false

    conoscenze:
      - testo: "Creazione di maschere per l'inserimento guidato e sicuro dei dati aziendali."
        is_minimo: true
      - testo: "Realizzazione di report stampabili per la presentazione sintetica dei dati."
        is_minimo: true
      - testo: "Importazione ed esportazione di dati tra foglio di calcolo e database; cenni alle macro e all'automatizzazione dei processi d'ufficio."
        is_minimo: false

    competenze_civica:
      - testo: "Riconoscere l'importanza dei sistemi informativi aziendali e il ruolo dell'ICT nella loro automatizzazione."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "5.2"

    verifiche_num: "1 pratica"
    verifiche_strumenti: "Creazione di maschere e report in laboratorio\nImportazione ed esportazione dati"
