# yaml-language-server: $schema=../schemas/schema_programmazione.json
#
# Riorganizzata per aderire più da vicino alla tabella "Secondo Biennio"
# di Informatica_AFM_Secondo_Biennio.md (Linee Guida ministeriali
# ufficiali), dopo una validazione a posteriori che ha rilevato due tipi
# di problema nelle versioni precedenti (basate su
# /Users/paolo.mosca/Downloads/Scuola/Programmazione/AFM/programmazione_didattica_terza_afm_info_pp_2.md):
#
# RIMOSSO (su richiesta esplicita, perché non richiesto dalla tabella
# indirizzo del secondo biennio):
#   - "Struttura del computer, reti e sistemi operativi in ambito
#     aziendale" (hardware/SO/rete/sicurezza): è materia del PRIMO
#     biennio (Informatica_Istituto_Tecnico_Primo_Biennio.md la elenca
#     esplicitamente), non del secondo — qui sarebbe una ripetizione.
#   - "Foglio di calcolo avanzato": mai citato nella tabella del secondo
#     biennio (lo è nel primo biennio: "utilizzare... il foglio
#     elettronico"). Il calcolo del budget/scostamenti (competenza sul
#     controllo di gestione) è stato spostato alla 4a, dove ha più senso.
#   - La UFC "Automatizzazione, reportistica e integrazione dati
#     aziendali" è stata assorbita nella UFC5 (query e reportistica),
#     restringendone il contenuto a ciò che è coperto dall'abilità
#     ministeriale "utilizzare le funzioni di un DBMS per estrapolare
#     informazioni" (maschere/report), lasciando fuori le macro/
#     automatizzazione d'ufficio non richieste.
#
# MANTENUTO (già allineato alla tabella ministeriale, contenuto invariato):
#   Gestione dei progetti; Sistema informativo/modelli organizzativi;
#   Modellazione E-R; Modello relazionale.
#
# Le UFC su controllo di gestione, marketing e servizi di rete/
# innovazione/scelta software — altre voci ministeriali rimaste scoperte
# — sono state aggiunte alla programmazione della 4a anziché qui, per
# mantenere un buon equilibrio nel numero di UFC tra i due anni (5 in 3a,
# 6 in 4a).
#
# Gli obiettivi minimi (is_minimo: true) sono scelti dall'assistente (il
# documento sorgente della riscrittura precedente non è più seguito 1:1).
# Riferimenti DigComp 3.0 e CINI (O-S-*, i codici del biennio riusati solo
# dove il contenuto corrisponde davvero — project management, modelli
# organizzativi, foglio di calcolo/reportistica non hanno equivalente
# nella proposta CINI 2017) verificati contro i documenti in
# docs/riferimenti/.

frameworks:
  DIGCOMP_3.0:
    nome: "Digital Competence Framework for Citizens (DigComp 3.0/2.2)"
    url: "https://joint-research-centre.ec.europa.eu/digcomp_en"
  CINI_INF:
    nome: "Indicazioni Nazionali per l'Insegnamento dell'Informatica - Consorzio CINI"
    url: "https://www.consorzio-cini.it/images/Proposta-Indicazioni-Nazionali-Informatica-Scuola-numerata.pdf"

dipartimento: "INFORMATICA"
ordinamento: "TECNICO ECONOMICO"
indirizzo: "AFM"
classe: "TERZA"

ufcs:
  - numero: 1
    descrizione: "Gestione dei progetti: metodologie e tecniche"
    periodo: "Settembre-Ottobre"

    competenze_disciplinari:
      - testo: "Identificare e applicare le metodologie e le tecniche della gestione per progetti."
        is_minimo: true

    abilita:
      - testo: "Individuare le fasi del ciclo di vita di un progetto (avvio, pianificazione, esecuzione, controllo, chiusura)."
        is_minimo: true
      - testo: "Scomporre un progetto in attività elementari mediante una Work Breakdown Structure (WBS)."
        is_minimo: true
      - testo: "Costruire un diagramma di Gantt per pianificare tempi e risorse di un progetto, anche con l'ausilio del foglio di calcolo."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "1.3"
      - testo: "Individuare i principali rischi di un progetto e le azioni di mitigazione."
        is_minimo: false

    conoscenze:
      - testo: "Il ciclo di vita di un progetto: fasi e obiettivi."
        is_minimo: true
      - testo: "Work Breakdown Structure (WBS) e diagramma di Gantt."
        is_minimo: true
      - testo: "Ruoli e responsabilità in un progetto (project manager, team, stakeholder); elementi di gestione del rischio."
        is_minimo: false

    competenze_civica:
      - testo: "Identificare bisogni e risposte tecnologiche adeguate alla pianificazione di un progetto."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "5.2"

    verifiche:
      - tipo: "Pratico"
        numero: 1
        strumenti: "Costruzione di un diagramma di Gantt in laboratorio\nEsercizi di scomposizione WBS"

  - numero: 2
    descrizione: "Sistema informativo aziendale, modelli organizzativi e analisi dei processi"
    periodo: "Novembre-Dicembre"

    competenze_disciplinari:
      - testo: "Riconoscere i diversi modelli organizzativi aziendali, documentare le procedure e ricercare soluzioni efficaci rispetto a situazioni date."
        is_minimo: true

    abilita:
      - testo: "Rappresentare l'architettura di un sistema informativo aziendale (dati, procedure, persone, tecnologie)."
        is_minimo: true
      - testo: "Riconoscere le principali strutture organizzative aziendali (funzionale, divisionale, a matrice) e i flussi informativi tra le funzioni aziendali."
        is_minimo: true
      - testo: "Rappresentare un processo aziendale mediante un diagramma di flusso (es. ciclo di evasione di un ordine cliente, ciclo di fatturazione)."
        is_minimo: true
      - testo: "Documentare con metodologie standard le fasi di raccolta, archiviazione e utilizzo dei dati aziendali."
        is_minimo: false
      - testo: "Individuare, a partire da un caso aziendale dato, la soluzione informatica più efficace rispetto alle esigenze descritte."
        is_minimo: false

    conoscenze:
      - testo: "Sistema informativo e sistema informatico: definizione e distinzione; componenti di un sistema informativo aziendale (dati, procedure, persone, tecnologie)."
        is_minimo: true
      - testo: "Modelli organizzativi aziendali: struttura funzionale, divisionale, a matrice; organigramma."
        is_minimo: true
      - testo: "Flussi informativi tra le funzioni aziendali (vendite, produzione, contabilità, magazzino, risorse umane)."
        is_minimo: true
      - testo: "Diagrammi di flusso per la documentazione dei processi aziendali."
        is_minimo: true

    competenze_civica:
      - testo: "Interpretare i sistemi aziendali nei loro modelli, processi e flussi informativi."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "1.3"

    verifiche:
      - tipo: "Scritto"
        numero: 1
        strumenti: "Esercizi di analisi di casi aziendali\nRappresentazione dell'architettura di un sistema informativo aziendale\nDiagrammi di flusso di processi aziendali"

  - numero: 3
    descrizione: "Modellazione concettuale e progettazione di basi di dati (modello E-R)"
    periodo: "Gennaio-Febbraio"

    competenze_disciplinari:
      - testo: "Analizzare i requisiti informativi di una realtà aziendale e rappresentarli mediante uno schema Entità-Relazione coerente."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-1"

    abilita:
      - testo: "Riconoscere i concetti di Entità, Attributo e Chiave Primaria."
        is_minimo: true
      - testo: "Distinguere una relazione 1 a N da una relazione N a M in un semplice contesto aziendale."
        is_minimo: true
      - testo: "Analizzare casi di studio economico-aziendali (gestione clienti/ordini, magazzino, fatturazione) per individuarne entità e relazioni."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-1"

    conoscenze:
      - testo: "Dai dati informali alla base di dati aziendale: concetti di dato, informazione e DBMS."
        is_minimo: true
      - testo: "Il modello Entità-Relazione: entità, attributi, chiave primaria."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-1"
      - testo: "Tipi di relazione (1:1, 1:N, N:M) e cardinalità."
        is_minimo: true

    competenze_civica:
      - testo: "Gestire dati, informazioni e contenuti digitali organizzandoli in strutture coerenti."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "1.3"

    verifiche:
      - tipo: "Scritto"
        numero: 1
        strumenti: "Esercizi di modellazione E-R su casi aziendali"

  - numero: 4
    descrizione: "Modello relazionale e struttura delle tabelle"
    periodo: "Marzo"

    competenze_disciplinari:
      - testo: "Tradurre uno schema Entità-Relazione in un insieme di tabelle correlate nel modello relazionale."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-1"

    abilita:
      - testo: "Identificare la chiave primaria e la chiave esterna nelle tabelle di un database elementare."
        is_minimo: true
      - testo: "Inserire, modificare e cancellare record all'interno delle tabelle di un DBMS."
        is_minimo: true
      - testo: "Creare la struttura di un database aziendale impostando i tipi di dato corretti per ogni campo e definendo le relazioni tra tabelle."
        is_minimo: false

    conoscenze:
      - testo: "Dallo schema E-R al modello relazionale: regole di derivazione."
        is_minimo: false
      - testo: "Concetto di tabella, campo, record e dominio."
        is_minimo: true
      - testo: "Chiavi primarie e chiavi esterne; integrità referenziale e regole per evitare ridondanze e anomalie."
        is_minimo: true

    competenze_civica:
      - testo: "Gestire dati, informazioni e contenuti digitali organizzandoli in strutture coerenti."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "1.3"

    verifiche:
      - tipo: "Pratico"
        numero: 1
        strumenti: "Creazione e popolamento di database in laboratorio (Access/LibreOffice Base)"

  - numero: 5
    descrizione: "Interrogazione e reportistica dei dati: query visuali, SQL base e strumenti di output"
    periodo: "Aprile-Giugno"

    competenze_disciplinari:
      - testo: "Interrogare un database per estrarre informazioni utili alle decisioni aziendali e presentarle mediante maschere e report."
        is_minimo: false

    abilita:
      - testo: "Creare una semplice query visuale (QBE) su una singola tabella impostando criteri di filtraggio."
        is_minimo: true
      - testo: "Scrivere una semplice istruzione SQL con la struttura SELECT ... FROM ... WHERE."
        is_minimo: true
      - testo: "Ordinare i dati con ORDER BY e applicare operatori logici (AND, OR, NOT) nei filtri."
        is_minimo: false
      - testo: "Formulare interrogazioni con join tra più tabelle e calcoli aggregati (SUM, COUNT, AVG, GROUP BY)."
        is_minimo: false
      - testo: "Creare una maschera semplice per l'inserimento dati tramite la procedura guidata del DBMS."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-N-2"
      - testo: "Generare un report di stampa standard a partire da una tabella o da una query."
        is_minimo: true

    conoscenze:
      - testo: "Creazione di interrogazioni con strumenti visuali (QBE)."
        is_minimo: true
      - testo: "Struttura dell'istruzione SELECT; clausola WHERE e operatori logici; ORDER BY."
        is_minimo: true
      - testo: "Congiunzione di più tabelle (join) e calcoli aggregati."
        is_minimo: false
      - testo: "Creazione di maschere per l'inserimento guidato dei dati e report stampabili per la presentazione sintetica dei dati."
        is_minimo: true

    competenze_civica:
      - testo: "Gestire dati e informazioni mediante strumenti di interrogazione strutturata."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "1.3"

    verifiche:
      - tipo: "Pratico"
        numero: 1
        strumenti: "Scrittura di query visuali e SQL in laboratorio\nCreazione di maschere e report"
      - tipo: "Scritto"
        numero: 1
        strumenti: "Quesiti a risposta aperta"
