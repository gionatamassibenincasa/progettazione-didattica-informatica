# yaml-language-server: $schema=../schemas/schema_programmazione.json
#
# Aggiornata sulla base di
# /Users/paolo.mosca/Downloads/Scuola/Programmazione/Liceo Scientifico SA/programmazione_didattica_quinta_liceo_scientifico.md
# (6 moduli sorgente: Architetture di rete/ISO-OSI-TCP-IP, Protocolli di
# rete/indirizzamento/routing, Programmazione di rete/socket/concorrenza,
# Sicurezza informatica/crittografia, Basi di dati avanzate/web app/cloud,
# Sistemi distribuiti/Web API/tecnologie emergenti). Il documento sorgente
# stimava ~90 ore totali (16+18+18+14+14+10), incompatibili con il quadro
# orario ministeriale di Informatica al Liceo Scientifico opz. Scienze
# Applicate (2 ore settimanali in ogni anno, ~66 ore annue — vedi anche la
# correzione già applicata alla programmazione della 4ª).
#
# Una UFC "Analisi degli algoritmi e complessità computazionale" (con
# algoritmi di ordinamento) era stata aggiunta qui su richiesta esplicita,
# ma è stata successivamente SPOSTATA alla programmazione della 4a: le
# indicazioni ministeriali collocano l'analisi di efficienza degli
# algoritmi (e gli alberi, aggiunti anch'essi in 4a) nel secondo biennio
# (3a-4a), non nel quinto anno.
#
# Aggiunta una UFC1 "Calcolo numerico e simulazioni" (Settembre, con
# Octave), per coprire la linea di lavoro ministeriale per il quinto anno
# "algoritmi di calcolo numerico e simulazioni di supporto al calcolo
# scientifico" (informatica_nuove_indicazioni_nazionali_liceo_sci_sa.pdf),
# non presente nel documento sorgente di questa riscrittura né altrove
# nella sequenza 1a/4a/5a. Contenuto ripreso dalla primissima versione di
# questa programmazione (basata su Progr 5 SCIENT.docx), estesa con un
# accenno alle simulazioni numeriche (Monte Carlo) per coprire anche quella
# parte della linea ministeriale. Le ore dei moduli sono state riproporzionate
# per lasciarle spazio, totale ~66 ore.
#
# Gli obiettivi minimi (is_minimo: true) delle UFC 2-7 riprendono il
# "Quadro sintetico degli obiettivi minimi" del documento sorgente (6
# punti, 1:1): 1. Reti e modello TCP/IP (componenti fisici, livelli TCP/IP,
# IP vs MAC); 2. Protocolli e indirizzamento (config di rete, TCP vs UDP);
# 3. Programmazione Socket (architettura client/server, script essenziale);
# 4. Sicurezza e crittografia (simmetrica/asimmetrica, firma digitale);
# 5. Web Applications e DB (architettura a 3 livelli, web app minimale);
# 6. Web API e JSON (formato JSON, scambio dati sul web). Gli obiettivi
# minimi della UFC1 (Calcolo numerico) sono scelti dall'assistente.
#
# Contenuti incrociati con INFORMATICA_Scientifico_opz_scienze_applicate.md
# e informatica_nuove_indicazioni_nazionali_liceo_sci_sa.pdf (sezione
# "Quinto anno": reti avanzate/sicurezza, sviluppo web/client-server —
# entrambe ben coperte da questa revisione). Riferimenti DigComp 3.0 e CINI
# (O-S-*, i codici del biennio riusati solo dove il contenuto corrisponde
# davvero — crittografia, socket/reti a basso livello, sistemi distribuiti e
# NoSQL non hanno equivalente nella proposta CINI 2017) in docs/riferimenti/.

frameworks:
  DIGCOMP_3.0:
    nome: "Digital Competence Framework for Citizens (DigComp 3.0/2.2)"
    url: "https://joint-research-centre.ec.europa.eu/digcomp_en"
  CINI_INF:
    nome: "Indicazioni Nazionali per l'Insegnamento dell'Informatica - Consorzio CINI"
    url: "https://www.consorzio-cini.it/images/Proposta-Indicazioni-Nazionali-Informatica-Scuola-numerata.pdf"

dipartimento: "INFORMATICA"
ordinamento: "LICEO SCIENTIFICO"
indirizzo: "SCIENTIFICO_SCIENZE_APPLICATE"
classe: "QUINTA"

ufcs:
  - numero: 1
    descrizione: "Calcolo numerico e simulazioni"
    periodo: "Settembre"

    competenze_disciplinari:
      - testo: "Applicare metodi di calcolo numerico e di simulazione per risolvere problemi che non ammettono soluzione analitica o che richiedono la modellazione di fenomeni reali."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-2"

    abilita:
      - testo: "Implementare algoritmi di calcolo numerico e di integrazione numerica."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.4"
      - testo: "Utilizzare il software Octave per la rappresentazione e l'analisi di funzioni matematiche."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-2"
      - testo: "Realizzare semplici simulazioni numeriche di fenomeni scientifici (es. metodo Monte Carlo, moto di un proiettile) in Octave."
        is_minimo: true
      - testo: "Valutare l'accuratezza e i limiti di un metodo di calcolo approssimato o di una simulazione numerica."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-A-3"

    conoscenze:
      - testo: "Elementi di calcolo numerico e metodi di integrazione numerica (es. metodo dei rettangoli, dei trapezi)."
        is_minimo: true
      - testo: "Principali funzioni e sintassi del software Octave; rappresentazione di vettori e matrici."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-2"
      - testo: "Simulazione numerica di fenomeni scientifici: il metodo Monte Carlo e semplici modelli dinamici."
        is_minimo: false

    competenze_civica:
      - testo: "Sviluppare contenuti digitali applicando strumenti di calcolo scientifico."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.1"
      - testo: "Gestire dati e informazioni numeriche in modo strutturato."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "1.3"

    verifiche_num: "1 scritta\n1 pratica"
    verifiche_strumenti: "Questionari\nEsercitazioni in laboratorio con Octave (calcolo numerico e simulazioni)"

  - numero: 2
    descrizione: "Architetture di rete e modelli di riferimento"
    periodo: "Ottobre-Novembre"

    competenze_disciplinari:
      - testo: "Analizzare e descrivere la topologia e i componenti di una rete informatica."
        is_minimo: true

    abilita:
      - testo: "Riconoscere le principali topologie di rete e la differenza tra LAN e WAN."
        is_minimo: true
      - testo: "Individuare le funzioni basilari dei livelli Fisico, Rete e Trasporto del modello ISO/OSI."
        is_minimo: true
      - testo: "Comprendere il concetto di incapsulamento dei dati."
        is_minimo: true
      - testo: "Distinguere le responsabilità e le PDU dei diversi livelli ISO/OSI e TCP/IP, confrontando i due modelli."
        is_minimo: false

    conoscenze:
      - testo: "Topologie di rete (stella, maglia, bus, anello); classificazione per estensione (PAN, LAN, MAN, WAN)."
        is_minimo: true
      - testo: "Mezzi trasmissivi e dispositivi di rete (hub, switch, router, access point)."
        is_minimo: false
      - testo: "Il modello ISO/OSI: architettura a livelli e incapsulamento dei dati; l'architettura TCP/IP."
        is_minimo: true

    competenze_civica:
      - testo: "Comprendere il ruolo delle reti e di Internet nella società digitale."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "2.1"

    verifiche_num: "1 scritta"
    verifiche_strumenti: "Test a scelta multipla\nDomande a risposta aperta"

  - numero: 3
    descrizione: "Protocolli di rete, indirizzamento e routing"
    periodo: "Dicembre"

    competenze_disciplinari:
      - testo: "Calcolare il subnetting e assegnare indirizzi IP a una sottorete."
        is_minimo: false

    abilita:
      - testo: "Distinguere un indirizzo IP privato da uno pubblico e applicare una subnet mask standard."
        is_minimo: true
      - testo: "Spiegare il ruolo dei servizi DNS e DHCP all'interno di una rete."
        is_minimo: true
      - testo: "Conoscere la differenza essenziale tra i protocolli TCP e UDP."
        is_minimo: true
      - testo: "Analizzare la differenza funzionale e prestazionale tra TCP e UDP e i principali protocolli di livello applicazione (HTTP/HTTPS, DNS, DHCP, FTP, SMTP/IMAP)."
        is_minimo: false

    conoscenze:
      - testo: "Indirizzamento IPv4: classi di indirizzi, subnet mask, CIDR; cenni a IPv6."
        is_minimo: true
      - testo: "Algoritmi e protocolli di instradamento (routing statico e dinamico)."
        is_minimo: false
      - testo: "Livello di trasporto: TCP e UDP, concetto di porta e socket; livello applicazione: HTTP/HTTPS, DNS, DHCP, FTP, SMTP/IMAP."
        is_minimo: true

    competenze_civica:
      - testo: "Utilizzare le reti e gli strumenti informatici in modo consapevole per attività di studio e ricerca."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "2.1"

    verifiche_num: "1 scritta\n1 pratica"
    verifiche_strumenti: "Problemi su indirizzamento e calcolo di sottoreti\nEsercitazioni pratiche"

  - numero: 4
    descrizione: "Programmazione di rete e concorrenza"
    periodo: "Gennaio"

    competenze_disciplinari:
      - testo: "Progettare e implementare un'applicazione client/server di rete basata su socket."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-R-2"

    abilita:
      - testo: "Comprendere la struttura generale dell'architettura client/server."
        is_minimo: true
      - testo: "Leggere e modificare uno script client/server di base (es. un server di echo)."
        is_minimo: true
      - testo: "Gestire connessioni contemporanee lato server mediante l'uso di thread o moduli asincroni."
        is_minimo: false

    conoscenze:
      - testo: "L'interfaccia socket: endpoint, indirizzo IP e numero di porta."
        is_minimo: true
      - testo: "Programmazione client/server mediante socket."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-R-2"
      - testo: "Gestione della concorrenza: processi, thread e programmazione asincrona."
        is_minimo: false

    competenze_civica:
      - testo: "Collaborare attraverso le tecnologie digitali nella realizzazione di progetti condivisi."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "2.4"

    verifiche_num: "1 pratica"
    verifiche_strumenti: "Sviluppo di applicazioni client/server socket in laboratorio"

  - numero: 5
    descrizione: "Sicurezza informatica, crittografia e privacy"
    periodo: "Febbraio"

    competenze_disciplinari:
      - testo: "Applicare le tecniche fondamentali di cifratura e hashing per la protezione dei dati, valutando l'affidabilità di una connessione di rete."
        is_minimo: false

    abilita:
      - testo: "Distinguere la crittografia simmetrica da quella asimmetrica."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "4.1"
      - testo: "Spiegare la funzione della firma digitale e dell'impronta hash."
        is_minimo: true
      - testo: "Riconoscere le principali minacce informatiche (malware, phishing, man-in-the-middle) e le buone pratiche di difesa."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "4.1"
      - testo: "Valutare la validità di un certificato digitale e l'affidabilità di una connessione protetta (HTTPS, SSL/TLS)."
        is_minimo: false

    conoscenze:
      - testo: "Principi di sicurezza informatica: riservatezza, integrità, disponibilità (triade CIA)."
        is_minimo: true
      - testo: "Crittografia simmetrica e asimmetrica; funzioni hash, firma digitale, certificati digitali e PKI."
        is_minimo: true
      - testo: "Sicurezza nei protocolli di rete (HTTPS, SSL/TLS, SSH, VPN) e minacce comuni."
        is_minimo: false

    competenze_civica:
      - testo: "Proteggere i dispositivi digitali comprendendo rischi e minacce negli ambienti digitali."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "4.1"
      - testo: "Proteggere i dati personali e la privacy negli ambienti digitali."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "4.2"

    verifiche_num: "1 scritta\n1 orale"
    verifiche_strumenti: "Test a scelta multipla\nColloqui sui concetti teorici"

  - numero: 6
    descrizione: "Basi di dati avanzate, web application e cloud computing"
    periodo: "Marzo-Aprile"

    competenze_disciplinari:
      - testo: "Realizzare un'applicazione web completa che esegua operazioni CRUD su basi di dati, applicando le proprietà transazionali per garantire la consistenza dei dati."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-R-2"

    abilita:
      - testo: "Riconoscere l'architettura a 3 livelli (3-tier) di un'applicazione web."
        is_minimo: true
      - testo: "Realizzare una pagina web in grado di inserire e visualizzare dati memorizzati in un database."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-R-2"
      - testo: "Comprendere le transazioni e le proprietà ACID nei DBMS."
        is_minimo: false
      - testo: "Distinguere i modelli di servizio cloud (IaaS, PaaS, SaaS)."
        is_minimo: false

    conoscenze:
      - testo: "Transazioni e proprietà ACID nei DBMS."
        is_minimo: false
      - testo: "Architetture web a 3-tier: client front-end, application server back-end, database server."
        is_minimo: true
      - testo: "Introduzione al cloud computing: modelli di servizio e di deployment."
        is_minimo: false

    competenze_civica:
      - testo: "Sviluppare contenuti digitali per il Web integrando servizi e basi di dati."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.1"

    verifiche_num: "1 pratica"
    verifiche_strumenti: "Sviluppo di web app con database integrato"

  - numero: 7
    descrizione: "Sistemi distribuiti, Web API e tecnologie emergenti"
    periodo: "Maggio-Giugno"

    competenze_disciplinari:
      - testo: "Utilizzare API REST esterne all'interno di uno script per estrarre o inviare dati in formato JSON, contestualizzando l'evoluzione verso architetture distribuite e basi di dati NoSQL."
        is_minimo: false

    abilita:
      - testo: "Comprendere la struttura del formato JSON."
        is_minimo: true
      - testo: "Effettuare una semplice richiesta HTTP a un'API web e interpretare la risposta."
        is_minimo: true
      - testo: "Contestualizzare l'evoluzione verso le basi di dati NoSQL e l'elaborazione distribuita."
        is_minimo: false

    conoscenze:
      - testo: "Sistemi distribuiti e Web Services; architetture REST e formato JSON."
        is_minimo: true
      - testo: "Panoramica sulle architetture moderne: microservizi, paradigmi NoSQL, cenni di intelligenza artificiale/apprendimento automatico."
        is_minimo: false

    competenze_civica:
      - testo: "Identificare e rispondere ai bisogni di competenza digitale in un contesto tecnologico in rapida evoluzione."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "5.4"

    verifiche_num: "1 pratica\n1 orale"
    verifiche_strumenti: "Consumo di API REST\nDiscussione e presentazione dei progetti"
