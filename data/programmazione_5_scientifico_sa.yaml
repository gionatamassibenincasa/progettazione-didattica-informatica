# yaml-language-server: $schema=../schemas/schema_programmazione.json
#
# Riscritta per aderire più da vicino al testo ministeriale (sezione
# "Quinto anno" di INFORMATICA_Scientifico_opz_scienze_applicate.md e le
# linee di lavoro di informatica_nuove_indicazioni_nazionali_liceo_sci_sa.pdf)
# invece di seguire integralmente
# /Users/paolo.mosca/Downloads/Scuola/Programmazione/Liceo Scientifico SA/programmazione_didattica_quinta_liceo_scientifico.md,
# la cui profondità tecnica su reti (subnetting, PDU per livello),
# concorrenza/thread, cloud computing (IaaS/PaaS/SaaS) e sistemi distribuiti
# (microservizi, NoSQL) va oltre quanto richiesto dai documenti ministeriali.
# Questi argomenti sono stati sfoltiti/generalizzati per fare spazio a tre
# voci ministeriali che risultavano scoperte: algoritmi su grafi (linea "AL"
# del quinto anno), tecniche di apprendimento automatico (linea "IA") e
# aspetti sociali/etici/giuridici delle TIC (terza sezione del quinto anno
# del documento più dettagliato). Aggiunto anche JavaScript lato client,
# esplicitamente citato per lo sviluppo web del quinto anno.
#
# Le 8 UFC risultanti mappano quasi 1:1 le voci ministeriali del quinto
# anno:
#   1. Calcolo numerico e simulazioni (linea "CS")
#   2. Sviluppo di applicazioni web e architetture client-server (sezione 1
#      del documento dettagliato; include JS lato client, non più la
#      concorrenza/thread)
#   3. Basi di dati avanzate (linea "BD")
#   4. Reti avanzate e sistemi distribuiti (parte della sezione 2 del
#      documento dettagliato e della linea "RS"; profondità tecnica
#      ridotta rispetto alla versione precedente)
#   5. Sicurezza informatica e crittografia (parte della sezione 2)
#   6. Algoritmi su grafi e crittografici (linea "AL", nuova)
#   7. Tecniche di apprendimento automatico (linea "IA", nuova/ampliata
#      rispetto al breve accenno che c'era prima; approfondisce quanto
#      introdotto nella UFC "Introduzione all'intelligenza artificiale"
#      della 4a)
#   8. Aspetti sociali, etici e giuridici delle TIC (sezione 3 del
#      documento dettagliato, nuova)
#
# Obiettivi minimi scelti dall'assistente per tutte le UFC (il documento
# sorgente della riscrittura precedente non è più seguito 1:1, quindi il
# suo "Quadro sintetico degli obiettivi minimi" non si applica più
# direttamente). Riferimenti DigComp 3.0 e CINI (O-S-*, i codici del
# biennio riusati solo dove il contenuto corrisponde davvero — crittografia,
# grafi in senso stretto, tecniche di ML e aspetti giuridici non hanno
# equivalente nella proposta CINI 2017) verificati contro i documenti in
# docs/riferimenti/.

frameworks:
  DIGCOMP_3.0:
    nome: "Digital Competence Framework for Citizens (DigComp 3.0/2.2)"
    url: "https://joint-research-centre.ec.europa.eu/digcomp_en"
  CINI_INF:
    nome: "Indicazioni Nazionali per l'Insegnamento dell'Informatica - Consorzio CINI"
    url: "https://www.consorzio-cini.it/images/Proposta-Indicazioni-Nazionali-Informatica-Scuola-numerata.pdf"

dipartimento: "INFORMATICA"
ordinamento: "LICEO SCIENTIFICO"
indirizzo: "SCIENTIFICO_SCIENZE_APPLICATE"
classe: "QUINTA"

ufcs:
  - numero: 1
    descrizione: "Calcolo numerico e simulazioni"
    periodo: "Settembre"

    competenze_disciplinari:
      - testo: "Applicare metodi di calcolo numerico e di simulazione per risolvere problemi che non ammettono soluzione analitica o che richiedono la modellazione di fenomeni reali."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-2"

    abilita:
      - testo: "Implementare algoritmi di calcolo numerico e di integrazione numerica."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.4"
      - testo: "Utilizzare il software Octave per la rappresentazione e l'analisi di funzioni matematiche."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-2"
      - testo: "Realizzare semplici simulazioni numeriche di fenomeni scientifici (es. metodo Monte Carlo, moto di un proiettile) in Octave."
        is_minimo: true
      - testo: "Valutare l'accuratezza e i limiti di un metodo di calcolo approssimato o di una simulazione numerica."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-A-3"

    conoscenze:
      - testo: "Elementi di calcolo numerico e metodi di integrazione numerica (es. metodo dei rettangoli, dei trapezi)."
        is_minimo: true
      - testo: "Principali funzioni e sintassi del software Octave; rappresentazione di vettori e matrici."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-2"
      - testo: "Simulazione numerica di fenomeni scientifici: il metodo Monte Carlo e semplici modelli dinamici."
        is_minimo: false

    competenze_civica:
      - testo: "Sviluppare contenuti digitali applicando strumenti di calcolo scientifico."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.1"
      - testo: "Gestire dati e informazioni numeriche in modo strutturato."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "1.3"

    verifiche_num: "1 scritta\n1 pratica"
    verifiche_strumenti: "Questionari\nEsercitazioni in laboratorio con Octave (calcolo numerico e simulazioni)"

  - numero: 2
    descrizione: "Sviluppo di applicazioni web e architetture client-server"
    periodo: "Ottobre-Dicembre"

    competenze_disciplinari:
      - testo: "Sviluppare un'applicazione web dinamica che integri elaborazione lato client, elaborazione lato server e accesso a una base di dati."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-R-2"

    abilita:
      - testo: "Comprendere la struttura generale dell'architettura client/server e il ruolo dei protocolli HTTP/HTTPS."
        is_minimo: true
      - testo: "Utilizzare il linguaggio JavaScript per l'elaborazione lato client (validazione di form, semplice interattività)."
        is_minimo: true
      - testo: "Riconoscere l'architettura a 3 livelli (3-tier) di un'applicazione web: client, application server, database server."
        is_minimo: true
      - testo: "Realizzare una pagina web dinamica in grado di inserire e visualizzare dati memorizzati in un database."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-R-2"
      - testo: "Comprendere la differenza tra invio dati con metodo GET e metodo POST."
        is_minimo: true
      - testo: "Modificare uno script guidato lato server per eseguire una query SELECT su un database locale."
        is_minimo: false

    conoscenze:
      - testo: "Architettura client/server; protocolli HTTP/HTTPS."
        is_minimo: true
      - testo: "Elementi di JavaScript per la programmazione lato client."
        is_minimo: true
      - testo: "Architetture web a 3 livelli: client front-end, application server back-end, database server."
        is_minimo: true
      - testo: "Scripting lato server per la connessione al database e la lettura/scrittura dei dati."
        is_minimo: false

    competenze_civica:
      - testo: "Sviluppare contenuti digitali per il Web integrando servizi e basi di dati."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.1"
      - testo: "Riconoscere la differenza tra client e server e comprendere il flusso di invio di un form."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "2.1"

    verifiche_num: "1 pratica"
    verifiche_strumenti: "Sviluppo di un'applicazione web con database integrato in laboratorio"

  - numero: 3
    descrizione: "Basi di dati avanzate"
    periodo: "Gennaio"

    competenze_disciplinari:
      - testo: "Progettare basi di dati aziendali applicando le proprietà transazionali per garantire la consistenza dei dati."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-1"

    abilita:
      - testo: "Comprendere le transazioni e le proprietà ACID nei DBMS."
        is_minimo: true
      - testo: "Realizzare operazioni CRUD (Create, Read, Update, Delete) su una base di dati."
        is_minimo: true
      - testo: "Progettare uno schema relazionale complesso, con più tabelle in relazione, a partire da un caso di studio."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-1"

    conoscenze:
      - testo: "Transazioni e proprietà ACID nei DBMS."
        is_minimo: true
      - testo: "Progettazione concettuale e logica di basi di dati relazionali complesse."
        is_minimo: false

    competenze_civica:
      - testo: "Gestire dati, informazioni e contenuti digitali organizzandoli in strutture coerenti."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "1.3"

    verifiche_num: "1 scritta\n1 pratica"
    verifiche_strumenti: "Esercizi di progettazione database\nOperazioni CRUD in laboratorio"

  - numero: 4
    descrizione: "Reti avanzate e sistemi distribuiti"
    periodo: "Febbraio"

    competenze_disciplinari:
      - testo: "Analizzare l'architettura di una rete di calcolatori e comprendere i principi di funzionamento dei sistemi distribuiti."
        is_minimo: true

    abilita:
      - testo: "Riconoscere le principali topologie di rete e i modelli di riferimento ISO/OSI e TCP/IP."
        is_minimo: true
      - testo: "Distinguere i principali protocolli di rete (TCP, UDP, HTTP, DNS) e il loro ruolo."
        is_minimo: true
      - testo: "Comprendere i principi di funzionamento di un sistema distribuito e il ruolo delle API REST nello scambio di dati in formato JSON."
        is_minimo: false
      - testo: "Effettuare una semplice richiesta HTTP a un'API web e interpretare la risposta in formato JSON."
        is_minimo: false

    conoscenze:
      - testo: "Topologie di rete; modelli di riferimento ISO/OSI e TCP/IP."
        is_minimo: true
      - testo: "Principali protocolli di rete: TCP, UDP, HTTP, DNS."
        is_minimo: true
      - testo: "Sistemi distribuiti: concetti di base; API REST e formato JSON."
        is_minimo: false

    competenze_civica:
      - testo: "Comprendere il ruolo delle reti e di Internet nella società digitale."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "2.1"

    verifiche_num: "1 scritta"
    verifiche_strumenti: "Test a scelta multipla\nDomande a risposta aperta"

  - numero: 5
    descrizione: "Sicurezza informatica e crittografia"
    periodo: "Marzo"

    competenze_disciplinari:
      - testo: "Applicare le tecniche fondamentali di cifratura e hashing per la protezione dei dati, valutando l'affidabilità di una connessione di rete."
        is_minimo: true

    abilita:
      - testo: "Distinguere la crittografia simmetrica da quella asimmetrica."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "4.1"
      - testo: "Spiegare la funzione della firma digitale e dell'impronta hash."
        is_minimo: true
      - testo: "Riconoscere le principali minacce informatiche (malware, phishing, man-in-the-middle) e le buone pratiche di difesa."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "4.1"
      - testo: "Valutare la validità di un certificato digitale e l'affidabilità di una connessione protetta (HTTPS, SSL/TLS)."
        is_minimo: false

    conoscenze:
      - testo: "Principi di sicurezza informatica: riservatezza, integrità, disponibilità (triade CIA)."
        is_minimo: true
      - testo: "Crittografia simmetrica e asimmetrica; funzioni hash, firma digitale, certificati digitali e PKI."
        is_minimo: true
      - testo: "Sicurezza nei protocolli di rete (HTTPS, SSL/TLS, SSH, VPN) e minacce comuni."
        is_minimo: false

    competenze_civica:
      - testo: "Proteggere i dispositivi digitali comprendendo rischi e minacce negli ambienti digitali."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "4.1"
      - testo: "Proteggere i dati personali e la privacy negli ambienti digitali."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "4.2"

    verifiche_num: "1 scritta\n1 orale"
    verifiche_strumenti: "Test a scelta multipla\nColloqui sui concetti teorici"

  - numero: 6
    descrizione: "Algoritmi su grafi e crittografici"
    periodo: "Aprile"

    competenze_disciplinari:
      - testo: "Rappresentare e risolvere problemi mediante algoritmi su grafi, riconoscendo l'uso di tecniche algoritmiche anche in ambito crittografico."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-A-1"

    abilita:
      - testo: "Rappresentare un grafo mediante matrice di adiacenza o liste di adiacenza."
        is_minimo: true
      - testo: "Applicare algoritmi di visita di un grafo in ampiezza (BFS) e in profondità (DFS)."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-A-1"
      - testo: "Applicare un algoritmo per il calcolo del cammino minimo (es. Dijkstra) in un semplice grafo pesato."
        is_minimo: false
      - testo: "Riconoscere l'uso di strutture a grafo e di tecniche algoritmiche nei protocolli crittografici (es. scambio di chiavi)."
        is_minimo: false

    conoscenze:
      - testo: "Grafi: nodi, archi, rappresentazione mediante matrice di adiacenza o liste di adiacenza."
        is_minimo: true
      - testo: "Algoritmi di visita di un grafo: BFS e DFS."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-A-1"
      - testo: "Cenni ad algoritmi su grafi pesati (cammino minimo) e loro applicazioni."
        is_minimo: false

    competenze_civica:
      - testo: "Programmazione e risoluzione di problemi tecnologici."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.4"

    verifiche_num: "1 scritta\n1 pratica"
    verifiche_strumenti: "Esercizi di rappresentazione e visita di grafi\nImplementazione in laboratorio"

  - numero: 7
    descrizione: "Tecniche di apprendimento automatico"
    periodo: "Maggio"

    competenze_disciplinari:
      - testo: "Comprendere i principi di base delle tecniche di apprendimento automatico e i loro ambiti applicativi."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "5.4"

    abilita:
      - testo: "Distinguere apprendimento supervisionato, non supervisionato e per rinforzo (cenni)."
        is_minimo: true
      - testo: "Riconoscere gli ambiti applicativi dei sistemi di intelligenza artificiale basati su percezione e azione."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "5.2"
      - testo: "Discutere criticamente l'uso dei sistemi di intelligenza artificiale generativa, riconoscendo possibili distorsioni (bias)."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "2.3"
      - testo: "Sperimentare un semplice strumento di apprendimento automatico guidato (es. classificazione di immagini)."
        is_minimo: false

    conoscenze:
      - testo: "Tecniche di apprendimento automatico: apprendimento supervisionato, non supervisionato, per rinforzo (cenni)."
        is_minimo: true
      - testo: "Cenni sulle reti neurali e sul loro funzionamento."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.2"
      - testo: "Sistemi di intelligenza artificiale generativa: potenzialità e limiti."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "5.4"

    competenze_civica:
      - testo: "Identificare e rispondere ai bisogni di competenza digitale in un contesto in rapida evoluzione."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "5.4"
      - testo: "Esercitare la cittadinanza digitale valutando criticamente l'uso di strumenti di IA."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "2.3"

    verifiche_num: "1 orale/scritta"
    verifiche_strumenti: "Discussione guidata\nAnalisi di casi di studio"

  - numero: 8
    descrizione: "Aspetti sociali, etici e giuridici delle TIC"
    periodo: "Giugno"

    competenze_disciplinari:
      - testo: "Analizzare le implicazioni giuridiche ed etiche legate all'uso dell'informatica."
        is_minimo: true

    abilita:
      - testo: "Distinguere le principali tipologie di licenze software e di contenuti digitali (copyright, Creative Commons, open source/software libero)."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.3"
      - testo: "Riconoscere gli aspetti normativi relativi alla protezione dei dati personali (GDPR) e alla privacy."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "4.2"
      - testo: "Valutare l'accessibilità di un sito o di un servizio digitale per utenti con disabilità."
        is_minimo: false
      - testo: "Discutere l'impatto delle tecnologie digitali sul lavoro e sui modelli di comunicazione nella società contemporanea."
        is_minimo: false

    conoscenze:
      - testo: "Tutela del diritto d'autore: copyright, licenze Creative Commons, software libero e open source."
        is_minimo: true
      - testo: "Protezione dei dati personali: privacy e GDPR."
        is_minimo: true
      - testo: "Accessibilità dei servizi digitali; impatto sociale delle TIC sul lavoro e sulla comunicazione."
        is_minimo: false

    competenze_civica:
      - testo: "Rispettare le norme su copyright e licenze nel riutilizzo di contenuti digitali."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.3"
      - testo: "Proteggere i dati personali e la privacy negli ambienti digitali."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "4.2"

    verifiche_num: "1 orale"
    verifiche_strumenti: "Discussione guidata\nAnalisi di casi di studio su licenze e privacy"
