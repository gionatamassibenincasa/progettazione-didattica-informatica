# yaml-language-server: $schema=../schemas/schema_programmazione.json
#
# Aggiornata sulla base di
# /Users/paolo.mosca/Downloads/Scuola/Programmazione/Liceo Scientifico SA/programmazione_informatica_classe4_cpp.md
# (5 moduli: Strutture dati dinamiche e ricorsione, Progettazione di basi di
# dati, Linguaggio SQL, Web Front-End HTML5/CSS3, Integrazione
# Web-Database). Il documento sorgente stimava ~88 ore totali (16+24+20+12+16),
# incompatibili con il quadro orario ministeriale di Informatica al Liceo
# Scientifico opz. Scienze Applicate (2 ore settimanali in ogni anno, ~66 ore
# annue): le ore stimate per modulo sono state riproporzionate.
#
# Dopo una validazione a posteriori rispetto alle indicazioni ministeriali
# (INFORMATICA_Scientifico_opz_scienze_applicate.md e
# informatica_nuove_indicazioni_nazionali_liceo_sci_sa.pdf) sono stati
# reintegrati due argomenti presenti nella versione precedente di questo
# file ma assenti dal nuovo documento sorgente: XML e formati non testuali
# (bitmap/vettoriale/compressione), ora nella UFC5 insieme a HTML5/CSS3, e
# una UFC7 "Introduzione all'intelligenza artificiale" (percezione/azione,
# reti neurali, IA generativa) — entrambi esplicitamente richiesti dalle
# "nuove indicazioni" per il secondo biennio.
#
# Aggiunti inoltre gli alberi (struttura, terminologia, cenni alle visite)
# nella UFC1, e una UFC2 "Analisi degli algoritmi: complessità
# computazionale e ordinamento" — quest'ultima spostata qui dalla
# programmazione della 5a (dove era stata inizialmente aggiunta su
# richiesta), perché le indicazioni ministeriali collocano sia gli alberi
# sia l'analisi di efficienza degli algoritmi nel secondo biennio (3a-4a),
# non nel quinto anno.
#
# Aggiunta anche una UFC3 "Programmazione orientata agli oggetti in C++"
# (classi, incapsulamento, costruttori/distruttori, cenni a ereditarietà e
# polimorfismo), per coprire l'ultima voce ancora mancante del secondo
# biennio ("approccia i paradigmi di programmazione avanzata, es. OOP" /
# "metodologie di programmazione... anche usando un linguaggio orientato
# agli oggetti"). C++ scelto per coerenza con tutto il resto del percorso
# (niente cambio di linguaggio/toolchain), sul modello già usato dal
# collega che segue la 3a SIA per lo stesso argomento (UFC "ITP-6" di
# programmazione_3_sia.yaml, non modificata). Reti e protocolli
# (ISO/OSI, TCP/IP) restano volutamente SOLO in 5a e non vengono duplicati
# qui, per scelta esplicita dell'utente, anche se il documento ministeriale
# più dettagliato li collocherebbe nel secondo biennio.
#
# Gli obiettivi minimi (is_minimo: true) delle UFC 1 (parziale), 4, 5, 7
# riprendono quasi testualmente il "Quadro sintetico degli obiettivi
# minimi" del documento sorgente:
#   1. Puntatori e liste (memoria statica/dinamica, puntatore elementare) → UFC1
#   2. Database concettuale e relazionale (entità, attributi, chiave primaria) → UFC4
#   3. SQL base (SELECT/FROM/WHERE su una tabella, INSERT/DELETE) → UFC5
#   4. HTML/CSS (pagina web essenziale con form di input) → UFC6
#   5. Architettura Web (client/server, GET/POST) → UFC7
# Gli obiettivi minimi delle UFC2 (complessità/ordinamento), UFC3 (OOP) e
# UFC8 (IA), e la parte su alberi della UFC1, sono scelti dall'assistente.
#
# Contenuti incrociati con INFORMATICA_Scientifico_opz_scienze_applicate.md
# e informatica_nuove_indicazioni_nazionali_liceo_sci_sa.pdf; riferimenti
# DigComp 3.0 e CINI (O-S-*, i codici del biennio riusati solo dove il
# contenuto corrisponde davvero) in docs/riferimenti/.

frameworks:
  DIGCOMP_3.0:
    nome: "Digital Competence Framework for Citizens (DigComp 3.0/2.2)"
    url: "https://joint-research-centre.ec.europa.eu/digcomp_en"
  CINI_INF:
    nome: "Indicazioni Nazionali per l'Insegnamento dell'Informatica - Consorzio CINI"
    url: "https://www.consorzio-cini.it/images/Proposta-Indicazioni-Nazionali-Informatica-Scuola-numerata.pdf"

dipartimento: "INFORMATICA"
ordinamento: "LICEO SCIENTIFICO"
indirizzo: "SCIENTIFICO_SCIENZE_APPLICATE"
classe: "QUARTA"

ufcs:
  - numero: 1
    descrizione: "Strutture dati dinamiche e algoritmi ricorsivi"
    periodo: "Settembre-Ottobre"

    competenze_disciplinari:
      - testo: "Risolvere problemi mediante funzioni ricorsive, individuando caso base e passo ricorsivo."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.4"
      - testo: "Implementare e gestire strutture dati dinamiche (liste concatenate, pile, code, alberi binari) in C++."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-2"

    abilita:
      - testo: "Comprendere la differenza tra memoria statica e memoria dinamica."
        is_minimo: true
      - testo: "Dichiarare e utilizzare un puntatore elementare."
        is_minimo: true
      - testo: "Tracciare l'esecuzione di una semplice funzione ricorsiva (es. fattoriale)."
        is_minimo: true
      - testo: "Implementare operazioni fondamentali su liste concatenate, pile e code (inserimento, rimozione, scansione)."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-2"
      - testo: "Creare, scorrere e visitare un albero binario, distinguendone radice, nodi e foglie."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-2"

    conoscenze:
      - testo: "Concetto di ricorsione: casi base e passi ricorsivi."
        is_minimo: true
      - testo: "Allocazione dinamica della memoria e puntatori."
        is_minimo: true
      - testo: "Strutture dati dinamiche: liste concatenate, pile (stack) e code (queue)."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-2"
      - testo: "Alberi binari: struttura, terminologia (radice, nodo, foglia, altezza) e cenni alle visite (in-order, pre-order, post-order)."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-2"

    competenze_civica:
      - testo: "Programmazione e risoluzione di problemi tecnologici."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.4"

    verifiche:
      - tipo: "Scritto"
        numero: 1
        strumenti: "Quesiti a risposta sintetica"
      - tipo: "Pratico"
        numero: 1
        strumenti: "Esercitazioni pratiche di scrittura codice in laboratorio"

  - numero: 2
    descrizione: "Analisi degli algoritmi: complessità computazionale e ordinamento"
    periodo: "Novembre"

    competenze_disciplinari:
      - testo: "Valutare l'efficienza di un algoritmo in termini di tempo e spazio, confrontando soluzioni alternative allo stesso problema."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-A-2"
      - testo: "Implementare e confrontare algoritmi di ordinamento, valutandone la complessità computazionale."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-A-1"

    abilita:
      - testo: "Stimare la complessità computazionale di un algoritmo mediante la notazione asintotica (O-grande)."
        is_minimo: true
      - testo: "Distinguere le classi di complessità più comuni (costante, logaritmica, lineare, quadratica, esponenziale) e riconoscerle in semplici algoritmi."
        is_minimo: true
      - testo: "Confrontare l'efficienza di algoritmi diversi che risolvono lo stesso problema (es. ricerca lineare e ricerca binaria)."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-A-2"
      - testo: "Implementare in C++ algoritmi di ordinamento elementari (bubble sort, selection sort, insertion sort)."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-A-1"
      - testo: "Implementare in C++ algoritmi di ordinamento efficienti basati sul paradigma divide et impera (merge sort o quick sort)."
        is_minimo: false
      - testo: "Confrontare gli algoritmi di ordinamento studiati in base alla loro complessità (O(n²) contro O(n log n))."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-A-2"

    conoscenze:
      - testo: "Concetto di complessità computazionale e notazione asintotica (O-grande)."
        is_minimo: true
      - testo: "Classi di complessità: O(1), O(log n), O(n), O(n log n), O(n²), O(2^n)."
        is_minimo: true
      - testo: "Algoritmi di ordinamento elementari: bubble sort, selection sort, insertion sort (complessità O(n²))."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-A-1"
      - testo: "Algoritmi di ordinamento efficienti: merge sort e quick sort (complessità O(n log n)); cenni al paradigma divide et impera."
        is_minimo: false

    competenze_civica:
      - testo: "Programmazione e risoluzione di problemi tecnologici, valutando criticamente l'efficienza delle soluzioni adottate."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.4"

    verifiche:
      - tipo: "Scritto"
        numero: 1
        strumenti: "Quesiti a risposta aperta\nEsercizi di confronto tra algoritmi"
      - tipo: "Pratico"
        numero: 1
        strumenti: "Implementazione e confronto di algoritmi di ordinamento in laboratorio"

  - numero: 3
    descrizione: "Programmazione orientata agli oggetti in C++"
    periodo: "Dicembre"

    competenze_disciplinari:
      - testo: "Applicare i concetti fondamentali della programmazione orientata agli oggetti per progettare soluzioni modulari e riutilizzabili."
        is_minimo: true

    abilita:
      - testo: "Definire una classe C++ incapsulando attributi (dati) e metodi (comportamenti)."
        is_minimo: true
      - testo: "Distinguere membri privati e pubblici di una classe e applicare il principio di incapsulamento."
        is_minimo: true
      - testo: "Implementare costruttori e distruttori per inizializzare e rilasciare correttamente le risorse di un oggetto."
        is_minimo: true
      - testo: "Istanziare e utilizzare oggetti di una classe definita."
        is_minimo: true
      - testo: "Realizzare una semplice relazione di ereditarietà tra classi (cenni)."
        is_minimo: false
      - testo: "Riconoscere il concetto di polimorfismo e l'overloading degli operatori (cenni)."
        is_minimo: false

    conoscenze:
      - testo: "Dalla struct alla class: differenze e transizione."
        is_minimo: true
      - testo: "Incapsulamento: attributi privati, metodi pubblici, modificatori di accesso."
        is_minimo: true
      - testo: "Costruttori e distruttori."
        is_minimo: true
      - testo: "Cenni di ereditarietà, polimorfismo e overloading degli operatori."
        is_minimo: false

    competenze_civica:
      - testo: "Programmazione e risoluzione di problemi tecnologici applicando il pensiero computazionale a paradigmi diversi."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.4"

    verifiche:
      - tipo: "Pratico"
        numero: 1
        strumenti: "Sviluppo di una classe C++ con relativo programma di test in laboratorio"

  - numero: 4
    descrizione: "Progettazione di basi di dati"
    periodo: "Gennaio"

    competenze_disciplinari:
      - testo: "Progettare lo schema Entità-Relazione di una realtà informativa e trasformarlo correttamente nel modello relazionale, applicando le regole di derivazione."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-1"
      - testo: "Riconoscere i concetti base di Entità, Attributo, Tabella e Chiave Primaria."
        is_minimo: true

    abilita:
      - testo: "Individuare la chiave primaria di una tabella elementare."
        is_minimo: true
      - testo: "Comprendere il legame tra tabelle mediante chiave esterna (foreign key) e il concetto di integrità referenziale."
        is_minimo: true
      - testo: "Rappresentare graficamente uno schema Entità-Relazione (entità, attributi, cardinalità)."
        is_minimo: false
      - testo: "Applicare le regole di derivazione dal modello Entità-Relazione al modello relazionale."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-1"

    conoscenze:
      - testo: "Sistema informativo e sistema informatico; funzioni di un DBMS."
        is_minimo: true
      - testo: "Modello concettuale Entità-Relazione: entità, attributi, chiavi primarie, cardinalità."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-1"
      - testo: "Modello relazionale: tabelle, campi, chiavi esterne, integrità referenziale."
        is_minimo: true

    competenze_civica:
      - testo: "Gestire dati, informazioni e contenuti digitali organizzandoli in strutture coerenti."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "1.3"

    verifiche:
      - tipo: "Scritto"
        numero: 1
        strumenti: "Esercizi di progettazione database (E-R e Relazionale)"
      - tipo: "Orale"
        numero: 1
        strumenti: "Colloqui di verifica"

  - numero: 5
    descrizione: "Il linguaggio SQL"
    periodo: "Febbraio"

    competenze_disciplinari:
      - testo: "Creare e popolare la struttura di un database in un ambiente DBMS, formulando query di selezione e di join per estrarre informazioni utili."
        is_minimo: false

    abilita:
      - testo: "Creare, modificare ed eliminare tabelle mediante il linguaggio DDL (CREATE TABLE, ALTER TABLE, DROP TABLE)."
        is_minimo: false
      - testo: "Inserire, modificare ed eliminare dati mediante il linguaggio DML (INSERT, UPDATE, DELETE)."
        is_minimo: true
      - testo: "Eseguire interrogazioni con SELECT, WHERE e ORDER BY su una singola tabella."
        is_minimo: true
      - testo: "Formulare interrogazioni avanzate con funzioni di aggregazione (COUNT, SUM, AVG), GROUP BY, HAVING e join tra tabelle (INNER JOIN)."
        is_minimo: false

    conoscenze:
      - testo: "Linguaggio DDL: CREATE TABLE, ALTER TABLE, DROP TABLE."
        is_minimo: false
      - testo: "Linguaggio DML: INSERT, UPDATE, DELETE."
        is_minimo: true
      - testo: "Linguaggio DQL: SELECT, WHERE, ORDER BY."
        is_minimo: true
      - testo: "Funzioni di aggregazione, GROUP BY, HAVING e join tra tabelle."
        is_minimo: false

    competenze_civica:
      - testo: "Gestire dati e informazioni mediante strumenti di interrogazione strutturata."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "1.3"

    verifiche:
      - tipo: "Pratico"
        numero: 1
        strumenti: "Scrittura di codice SQL in laboratorio"
      - tipo: "Scritto"
        numero: 1
        strumenti: "Quesiti a risposta sintetica"

  - numero: 6
    descrizione: "Linguaggi di markup, formati digitali e Web Front-End (XML, HTML5, CSS3)"
    periodo: "Marzo"

    competenze_disciplinari:
      - testo: "Rappresentare e strutturare informazioni mediante linguaggi di markup."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-3"
      - testo: "Realizzare pagine web strutturate con moduli (form) per l'invio di dati, applicando stili grafici coerenti ed essenziali."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-3"

    abilita:
      - testo: "Scrivere documenti XML e HTML sintatticamente corretti e ben strutturati, contenenti testo, immagini e collegamenti ipertestuali."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-3"
      - testo: "Distinguere formati di rappresentazione non testuale (bitmap, vettoriale) e i principali formati di compressione."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.1"
      - testo: "Inserire un modulo (form) con i principali campi di input (text, submit)."
        is_minimo: true
      - testo: "Applicare fogli di stile CSS3 per definire regole di stile, selettori e layout di base."
        is_minimo: false

    conoscenze:
      - testo: "Sintassi e struttura di XML e HTML; concetto di dato e metadato."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-3"
      - testo: "Formati immagine bitmap e vettoriali; principali algoritmi di compressione."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.1"
      - testo: "Architettura del Web: client/server, protocollo HTTP/HTTPS."
        is_minimo: true
      - testo: "Struttura di un documento HTML5: tag principali, formattazione, tabelle, form di inserimento dati."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-3"
      - testo: "Fogli di stile CSS3: selettori, regole di stile, posizionamento e layout di base."
        is_minimo: false

    competenze_civica:
      - testo: "Sviluppare contenuti digitali per il Web in formati appropriati al contesto d'uso."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.1"

    verifiche:
      - tipo: "Pratico"
        numero: 1
        strumenti: "Produzione di documenti XML/HTML e pagine web in laboratorio"

  - numero: 7
    descrizione: "Integrazione Web e Basi di Dati"
    periodo: "Aprile-Maggio"

    competenze_disciplinari:
      - testo: "Collegare un form HTML a uno script server-side per recuperare dati dal database e mostrarli all'interno di una pagina web dinamica."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-R-2"

    abilita:
      - testo: "Comprendere la differenza tra invio dati con metodo GET e metodo POST."
        is_minimo: true
      - testo: "Modificare uno script guidato per eseguire una query SELECT su un database locale."
        is_minimo: true
      - testo: "Distinguere l'elaborazione lato server da quella lato client."
        is_minimo: false

    conoscenze:
      - testo: "Elaborazione lato server e lato client; passaggio dati tramite i metodi GET e POST."
        is_minimo: true
      - testo: "Scripting lato server per la connessione al database e la lettura/scrittura dei dati."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-R-2"

    competenze_civica:
      - testo: "Riconoscere la differenza tra client e server e comprendere il flusso di invio di un form."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "2.1"

    verifiche:
      - tipo: "Pratico"
        numero: 1
        strumenti: "Script di connessione al database"
      - tipo: "Orale"
        numero: 1
        strumenti: "Colloqui di verifica sui progetti realizzati"

  - numero: 8
    descrizione: "Introduzione all'intelligenza artificiale"
    periodo: "Giugno"

    competenze_disciplinari:
      - testo: "Comprendere i concetti di base dei sistemi di intelligenza artificiale e le loro modalità realizzative."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "5.4"

    abilita:
      - testo: "Riconoscere gli ambiti applicativi dei sistemi di intelligenza artificiale basati su percezione e azione."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "5.2"
      - testo: "Discutere criticamente l'uso dei sistemi di intelligenza artificiale generativa, riconoscendo possibili distorsioni (bias)."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "2.3"

    conoscenze:
      - testo: "Cenni sulle reti neurali e sulle tecniche di apprendimento automatico (machine learning)."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.2"
      - testo: "Sistemi di intelligenza artificiale generativa: potenzialità e limiti."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "5.4"

    competenze_civica:
      - testo: "Identificare e rispondere ai bisogni di competenza digitale in un contesto in rapida evoluzione."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "5.4"
      - testo: "Esercitare la cittadinanza digitale valutando criticamente l'uso di strumenti di IA."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "2.3"

    verifiche:
      - tipo: "Orale"
        numero: 1
        strumenti: "Discussione guidata"
      - tipo: "Scritto"
        numero: 1
        strumenti: "Questionario\nAnalisi di casi di studio"
