# yaml-language-server: $schema=../schemas/schema_programmazione.json

frameworks:
  DIGCOMP_3.0:
    nome: "Digital Competence Framework for Citizens (DigComp 3.0/2.2)"
    url: "https://joint-research-centre.ec.europa.eu/digcomp_en"
  CINI_INF:
    nome: "Indicazioni Nazionali per l'Insegnamento dell'Informatica - Consorzio CINI"
    url: "https://www.consorzio-cini.it/images/Proposta-Indicazioni-Nazionali-Informatica-Scuola-numerata.pdf"

dipartimento: "INFORMATICA"
ordinamento: "LICEO SCIENTIFICO"
indirizzo: "SCIENTIFICO_SCIENZE_APPLICATE"
classe: "QUARTA"

ufcs:
  - numero: 1
    descrizione: "Basi di dati relazionali"
    periodo: "Settembre-Novembre"

    competenze_disciplinari:
      - testo: "Progettare una base di dati relazionale a partire dall'analisi di un semplice contesto applicativo."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-1"
      - testo: "Realizzare e interrogare una base di dati relazionale per risolvere problemi di gestione delle informazioni."
        is_minimo: true

    abilita:
      - testo: "Creare tabelle, definire chiavi primarie ed esterne e stabilire relazioni tra tabelle."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-1"
      - testo: "Scrivere query SQL di selezione, proiezione e giunzione per estrarre informazioni da più tabelle."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "1.3"
      - testo: "Progettare maschere e report orientati alle esigenze di consultazione dell'utente finale."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-N-2"
      - testo: "Importare ed esportare dati tra formati differenti (CSV, testo delimitato)."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.2"

    conoscenze:
      - testo: "Il modello relazionale dei dati: entità, attributi, chiavi primarie ed esterne."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-1"
      - testo: "La normalizzazione delle basi di dati (prima, seconda e terza forma normale)."
        is_minimo: false
      - testo: "Sintassi di base del linguaggio SQL (DDL e DML)."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "1.3"

    competenze_civica:
      - testo: "Gestire dati, informazioni e contenuti digitali organizzandoli in strutture coerenti."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "1.3"
      - testo: "Rispettare le norme su copyright e licenze nel riutilizzo di dataset e contenuti digitali."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.3"

    verifiche_num: "1 scritta/pratica\n1 orale"
    verifiche_strumenti: "Verifiche pratiche al PC (progettazione/interrogazione DB)\nColloqui orali\nDBMS relazionale (es. MySQL/Access)"

  - numero: 2
    descrizione: "Programmazione strutturata e modulare in C++"
    periodo: "Dicembre-Febbraio"

    competenze_disciplinari:
      - testo: "Sviluppare soluzioni algoritmiche a problemi mediante strutture dati e programmazione modulare."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-A-1"
          - framework_id: "CINI_INF"
            codice: "O-S-A-2"
      - testo: "Valutare la correttezza e l'efficienza di un programma rispetto al problema da risolvere."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-A-3"
          - framework_id: "CINI_INF"
            codice: "O-S-A-4"

    abilita:
      - testo: "Utilizzare array monodimensionali e bidimensionali (matrici) per organizzare collezioni di dati."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-P-5"
          - framework_id: "DIGCOMP_3.0"
            codice: "3.4"
      - testo: "Progettare e implementare funzioni e procedure per suddividere un programma in moduli riutilizzabili."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-P-6"
      - testo: "Utilizzare cicli annidati e strutture di selezione per implementare algoritmi su strutture dati complesse."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-P-4"
      - testo: "Scrivere programmi in C++ rispettandone la sintassi e le convenzioni."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-P-7"

    conoscenze:
      - testo: "Array monodimensionali e matrici: dichiarazione, inizializzazione, scansione."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-P-5"
      - testo: "Funzioni e procedure: passaggio di parametri per valore e per riferimento."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-P-6"
      - testo: "Cenni di ricorsione."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-A-1"

    competenze_civica:
      - testo: "Programmazione e risoluzione di problemi tecnologici."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.4"
      - testo: "Sviluppare contenuti digitali originali applicando il pensiero computazionale."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.1"

    verifiche_num: "2 scritte/pratiche\n1 orale"
    verifiche_strumenti: "Verifiche pratiche di produzione codice\nColloqui orali\nIDE C++ (es. Code::Blocks / Dev-C++)"

  - numero: 3
    descrizione: "Linguaggi di markup, formati digitali e applicazioni web"
    periodo: "Marzo-Aprile"

    competenze_disciplinari:
      - testo: "Rappresentare e strutturare informazioni mediante linguaggi di markup."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-3"

    abilita:
      - testo: "Scrivere documenti XML e HTML sintatticamente corretti e ben strutturati."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-3"
      - testo: "Distinguere formati di rappresentazione non testuale (bitmap, vettoriale) e i principali formati di compressione."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.1"
      - testo: "Realizzare una semplice applicazione web-oriented che combini contenuti e servizi in rete."
        is_minimo: false
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-R-2"

    conoscenze:
      - testo: "Sintassi e struttura di XML e HTML; concetto di dato e metadato."
        is_minimo: true
        riferimenti:
          - framework_id: "CINI_INF"
            codice: "O-S-D-3"
      - testo: "Formati immagine bitmap e vettoriali; principali algoritmi di compressione."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.1"

    competenze_civica:
      - testo: "Sviluppare contenuti digitali in formati appropriati al contesto d'uso."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.1"
      - testo: "Interagire e comunicare attraverso le tecnologie digitali nel rispetto delle regole della rete."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "2.1"

    verifiche_num: "1 scritta/pratica"
    verifiche_strumenti: "Produzione di pagine XML/HTML\nColloqui orali"

  - numero: 4
    descrizione: "Introduzione all'intelligenza artificiale"
    periodo: "Maggio-Giugno"

    competenze_disciplinari:
      - testo: "Comprendere i concetti di base dei sistemi di intelligenza artificiale e le loro modalità realizzative."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "5.4"

    abilita:
      - testo: "Riconoscere gli ambiti applicativi dei sistemi di intelligenza artificiale basati su percezione e azione."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "5.2"
      - testo: "Discutere criticamente l'uso dei sistemi di intelligenza artificiale generativa, riconoscendo possibili distorsioni (bias)."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "2.3"

    conoscenze:
      - testo: "Cenni sulle reti neurali e sulle tecniche di apprendimento automatico (machine learning)."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "3.2"
      - testo: "Sistemi di intelligenza artificiale generativa: potenzialità e limiti."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "5.4"

    competenze_civica:
      - testo: "Identificare e rispondere ai bisogni di competenza digitale in un contesto in rapida evoluzione."
        is_minimo: true
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "5.4"
      - testo: "Esercitare la cittadinanza digitale valutando criticamente l'uso di strumenti di IA."
        is_minimo: false
        riferimenti:
          - framework_id: "DIGCOMP_3.0"
            codice: "2.3"

    verifiche_num: "1 orale/scritta"
    verifiche_strumenti: "Discussione guidata\nQuestionario\nAnalisi di casi di studio"
